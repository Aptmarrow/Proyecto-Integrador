name: CI — Testing & Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Unit, API & Physics Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install Backend dependencies
        run: npm --prefix ./Backend ci

      - name: Run Backend test suite with coverage
        run: npm run test:coverage

      - name: Run authoritative physics test script
        run: npm run test:physics

  frontend-build:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install Frontend dependencies
        run: npm --prefix ./Frontend ci --legacy-peer-deps

      - name: Run TypeScript typecheck
        run: npm run typecheck:frontend

      - name: Build production bundle
        env:
          VITE_API_URL: /api
        run: npm run build:frontend

  docker-validate:
    name: Validate Docker Compose Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare dummy .env from example
        run: cp Backend/.env.example Backend/.env

      - name: Validate docker-compose.yml
        run: docker compose config -q

