name: CD — Continuous Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-containers:
    name: Verify Tests & Build Unified Cloud Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install Backend dependencies
        run: npm --prefix ./Backend ci

      - name: Run Backend test suite before build
        run: npm run test:backend

      - name: Run authoritative physics test suite
        run: npm run test:physics

      - name: Build unified production Docker image
        run: docker build -t danmakrew-cloud:ci .

  deploy-cloud:
    name: Deploy to Azure Cloud VM
    needs: build-containers
    runs-on: ubuntu-latest
    steps:
      - name: Deploy unified container to Azure VM (or Railway)
        env:
          RAILWAY_WEBHOOK_URL: ${{ secrets.RAILWAY_WEBHOOK_URL }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          if [ -n "$VPS_HOST" ] && [ -n "$VPS_USER" ] && [ -n "$VPS_SSH_KEY" ]; then
            DEPLOY_DIR="${VPS_DEPLOY_PATH:-~/Proyecto-Integrador}"
            mkdir -p ~/.ssh
            printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "${VPS_USER}@${VPS_HOST}" bash -s <<EOF
              set -euo pipefail
              cd ${DEPLOY_DIR}
              git fetch origin main
              git checkout main
              git reset --hard origin/main
              docker build -t danmakrew-cloud:latest .
              docker rm -f danmakrew || true
              docker run -d \
                --name danmakrew \
                --network danmakrew-net \
                --add-host=host.docker.internal:host-gateway \
                --restart unless-stopped \
                --env-file ${DEPLOY_DIR}/Backend/.env \
                -e PORT=8080 \
                -e HOST=0.0.0.0 \
                -e NODE_ENV=production \
                danmakrew-cloud:latest
              sleep 4
              docker exec danmakrew curl -fsS http://127.0.0.1:8080/api/health
          EOF
            echo "Azure VM deployment completed and healthcheck passed."
          elif [ -n "$RAILWAY_WEBHOOK_URL" ]; then
            curl --fail --silent --show-error -X POST "$RAILWAY_WEBHOOK_URL"
            echo "Railway deployment triggered successfully."
          else
            echo "Unified Docker image & tests passed."
            echo "Configure GitHub Secrets (VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_DEPLOY_PATH) to enable automatic Azure rollout on merge to main."
          fi
