$kind: http-request
description: Actualiza configuracion de la sala (name, map, isPublic, difficulty). Solo puede hacerlo el host.
url: "{{base_url}}/api/rooms/{{room_id}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Sala actualizada",
      "map": "classic",
      "isPublic": true,
      "difficulty": "no_mercy"
    }
order: 6000
